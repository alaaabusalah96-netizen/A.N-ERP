name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      APP_PEPPER: ci-dummy-pepper-not-for-production-use-long-secret
      STRICT_PROD_SECURITY: "false"
      FIREBASE_PROJECT_ID: "custodyflow"
      VITE_FIREBASE_PROJECT_ID: "custodyflow"
      FIREBASE_API_KEY: "dummy-ci-api-key"
      VITE_FIREBASE_API_KEY: "dummy-ci-api-key"
      FIREBASE_AUTH_DOMAIN: "custodyflow.firebaseapp.com"
      VITE_FIREBASE_AUTH_DOMAIN: "custodyflow.firebaseapp.com"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify CI dependency contract
        run: npm run verify:ci-deps

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: A.N plane static verifies
        env:
          STRICT_PROD_SECURITY: "false"
          AN_ALLOW_INMEMORY_FALLBACK: "1"
        run: |
          npx tsx scripts/verifyMergeAll.ts
          npx tsx scripts/verifyAnAdapterFailClosed2.ts
          npx tsx scripts/verifyAnAdapterRouteTest1.ts
          npx tsx scripts/verifyAnMigIdem1.ts
          npx tsx scripts/verifyAnFixStore1.ts
          npx tsx scripts/verifyAnFixSec1.ts
          npx tsx scripts/verifyAnAuthBridge1.ts
          npx tsx scripts/verifyAnAuthCookies1.ts
          npx tsx scripts/verifyAnAuthRefreshMe1.ts
          npx tsx scripts/verifyAnAuthRoleMap1.ts
          npx tsx scripts/verifyAnFixPgRole1.ts

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Rules Emulator Tests
        run: npm run test:rules
